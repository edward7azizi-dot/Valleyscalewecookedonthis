  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #010101;
      --blue-1: #38BDF8;
      --blue-2: #2563EB;
      --blue-3: #4F46E5;
      --gradient: linear-gradient(135deg, #38BDF8 0%, #2563EB 50%, #4F46E5 100%);
      --gradient-text: linear-gradient(135deg, #ffffff 0%, #38BDF8 55%, #4F46E5 100%);
      --glass-bg: rgba(255,255,255,0.04);
      --glass-bg-md: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.08);
      --glass-border-hover: rgba(56,189,248,0.35);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.72);
      --text-muted: rgba(255,255,255,0.42);
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.3); border-radius: 3px; }

    /* Gradient text */
    .gradient-text {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-text-blue {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Glass card */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .glass-md {
      background: var(--glass-bg-md);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-hover {
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }
    .glass-hover:hover {
      border-color: var(--glass-border-hover);
      box-shadow: 0 0 24px rgba(56,189,248,0.1), 0 0 60px rgba(37,99,235,0.06);
      background: rgba(255,255,255,0.065);
    }

    /* Gradient button */
    .btn-gradient {
      background: var(--gradient);
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .btn-gradient:hover { opacity: 0.88; transform: translateY(-1px); }

    /* Scroll animation */
    .fade-up {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1), transform 0.65s cubic-bezier(0.22,1,0.36,1);
    }
    .fade-up.visible { opacity: 1; transform: translateY(0); }

    .fade-in {
      opacity: 0;
      transition: opacity 0.65s ease;
    }
    .fade-in.visible { opacity: 1; }

    /* Hero entrance animations */
    @keyframes heroSlideUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-anim-1 { animation: heroSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s both; }
    .hero-anim-2 { animation: heroSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.3s both; }
    .hero-anim-3 { animation: heroSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.5s both; }
    .hero-anim-4 { animation: heroSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.7s both; }
    .hero-anim-5 { animation: heroSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.85s both; }

    /* Infinite slider */
    @keyframes sliderScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .slider-track {
      display: flex;
      width: max-content;
      animation: sliderScroll 28s linear infinite;
    }
    .slider-track:hover { animation-play-state: paused; }

    /* Accordion */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease;
      opacity: 0;
    }
    .accordion-content.open {
      max-height: 400px;
      opacity: 1;
    }

    /* Service card expand */
    .service-bullets {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      opacity: 0;
    }
    .service-card:hover .service-bullets,
    .service-card.active .service-bullets {
      max-height: 240px;
      opacity: 1;
    }

    /* Connector line */
    .connector {
      position: absolute;
      top: 50%;
      right: -1px;
      width: calc(100% + 2px);
      height: 1px;
      background: linear-gradient(90deg, rgba(56,189,248,0.4), rgba(79,70,229,0.4));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.8s ease 0.3s;
    }
    .connector.visible { transform: scaleX(1); }

    /* Glow orb */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }

    /* Section styles */
    section { position: relative; }

    /* Nav */
    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-family: var(--font-body);
      transition: color 0.2s ease;
    }
    .nav-link:hover { color: var(--text-primary); }

    /* Pill badge */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px 6px 8px;
      border-radius: 100px;
      background: rgba(28,27,36,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      font-size: 13px;
      font-weight: 500;
    }

    /* Stats */
    .stat-divider {
      width: 1px;
      height: 28px;
      background: rgba(255,255,255,0.1);
    }

    /* Team avatar placeholder */
    .avatar-placeholder {
      background: linear-gradient(135deg, rgba(56,189,248,0.2), rgba(79,70,229,0.2));
      border: 1px solid rgba(56,189,248,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: rgba(56,189,248,0.6);
    }

    /* Calendar mock */
    .cal-day {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
      font-family: var(--font-body);
    }
    .cal-day:hover { background: rgba(56,189,248,0.15); }
    .cal-day.selected { background: var(--gradient); color: white; font-weight: 600; }
    .cal-day.today { border: 1px solid rgba(56,189,248,0.4); }
    .cal-day.disabled { opacity: 0.25; cursor: default; }

    /* Responsive helpers */
    @media (max-width: 768px) {
      .hide-mobile { display: none !important; }
    }
    @media (min-width: 769px) {
      .hide-desktop { display: none !important; }
    }

    /* Hero CTA slide effect */
    .hero-cta-wrap { overflow: hidden; position: relative; }
    .hero-cta-wrap::before {
      content: '';
      position: absolute; inset: 0; border-radius: 100px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      transform: translateX(-100%);
      pointer-events: none;
    }
    .hero-cta-wrap:hover::before { transform: translateX(100%); transition: transform 0.55s ease; }
    .hero-cta-wrap:hover { box-shadow: 0 0 28px rgba(56,189,248,0.2); transition: box-shadow 0.3s ease; }
    .hero-cta-text { display: inline-block; transition: transform 0.25s ease; }
    .hero-cta-wrap:hover .hero-cta-text { transform: translateX(-4px); }

    /* Flip card */
    .flip-card { perspective: 1200px; cursor: pointer; }
    .flip-card-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22,1,0.36,1);
    }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .flip-card-back { transform: rotateY(180deg); }
    @media (max-width: 768px) {
      .faq-flip-grid { grid-template-columns: 1fr !important; }
    }

    /* Hero mobile overlay */
    @media (min-width: 769px) {
      .hero-mobile-overlay { display: none !important; }
    }

    /* ── Mobile overrides ── */
    html, body {
      overflow-x: hidden;
      max-width: 100vw;
    }

    @media (max-width: 768px) {
      .hero-mobile-overlay { background: rgba(1,1,1,0.58) !important; display: block !important; }

      /* Video: full width on mobile */
      .hero-video { width: 100% !important; }

      /* Hero text: center on mobile */
      .hero-content { justify-content: center !important; text-align: left; }
      .hero-text-col { max-width: 100% !important; }

      /* Prevent any section from overflowing */
      section, footer, nav > div {
        max-width: 100vw;
        overflow-x: hidden;
      }

      /* Hero: stack layout, smaller text */
      .hero-text-col {
        flex: 0 0 100% !important;
        padding-right: 0 !important;
        max-width: 100% !important;
      }

      /* Logo slider: contain overflow */
      .slider-track {
        max-width: none;
      }

      /* Nav: hide Book a Call button on mobile (hamburger handles it) */
      .nav-cta-desktop {
        display: none !important;
      }

      /* Stat row: smaller gap */
      .hero-stat-row {
        gap: 14px !important;
        flex-wrap: wrap;
      }

      /* Section padding reduction */
      section {
        padding-left: 20px !important;
        padding-right: 20px !important;
      }

      /* Booking grid: single column */
      .booking-grid {
        grid-template-columns: 1fr !important;
        gap: 36px !important;
      }

      /* Why fail 3-col inner: stack */
      .whyfail-inner {
        grid-template-columns: 1fr !important;
      }

      /* Footer: stack */
      .footer-inner {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 20px !important;
      }
    }
  </style>

const { useState, useEffect, useRef, useCallback } = React;

// Shared hooks — exported to window

function useScrollAnimation(threshold = 0.15) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          el.classList.add('visible');
          obs.disconnect();
        }
      },
      { threshold }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return ref;
}

function useStaggerAnimation(count, threshold = 0.12) {
  const containerRef = useRef(null);
  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;
    const children = container.querySelectorAll('[data-stagger]');
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          children.forEach((child, i) => {
            setTimeout(() => child.classList.add('visible'), i * 110);
          });
          obs.disconnect();
        }
      },
      { threshold }
    );
    obs.observe(container);
    return () => obs.disconnect();
  }, [count]);
  return containerRef;
}

Object.assign(window, { useScrollAnimation, useStaggerAnimation });

  { label: 'FAQ', href: '#faq' },

function CalendlyEmbed() {
  const ref = useRef(null);
  useEffect(() => {
    const init = () => {
      if (window.Calendly && ref.current && !ref.current.dataset.initialized) {
        ref.current.dataset.initialized = 'true';
        window.Calendly.initInlineWidget({
          url: 'https://calendly.com/edward-valleyscale/30min?background_color=0d0f14&text_color=ffffff&primary_color=38BDF8&hide_gdpr_banner=1',
          parentElement: ref.current,
        });
      }
    };
    init();
    window.addEventListener('load', init);
    const t = setTimeout(init, 2500);
    return () => { clearTimeout(t); window.removeEventListener('load', init); };
  }, []);
  return (
    <div style={{ borderRadius: 20, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.09)', background: 'rgba(13,15,20,0.95)' }}>
      <div ref={ref} style={{ minWidth: 320, height: 700 }} />
    </div>
  );
}
